name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # или master, смотря какая у вас ветка

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: "deployment.outputs.page_url" }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm # или yarn / pnpm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build # здесь должна вызываться ваша сборка, которая делает папку out
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # указываем, какую именно папку загружать на Pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4